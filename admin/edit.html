<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#115e59">
  <title>Edit website | Glastic Designs</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    html, body { margin: 0; height: 100%; }
    body { font-family: Inter, system-ui, sans-serif; background: #0c0a09; color: #fafaf9; }
    .gate { display: flex; align-items: center; justify-content: center; min-height: 100dvh; padding: 1.5rem; text-align: center; }
    .gate-panel { max-width: 22rem; background: #fff; color: #1c1917; border-radius: 1.25rem; padding: 1.5rem; text-align: left; }
    .gate-panel input { width: 100%; min-height: 2.75rem; margin: 0.35rem 0 0.75rem; border-radius: 0.75rem; border: 1px solid #e7e5e4; padding: 0 0.75rem; font: inherit; }
    .gate-panel .btn-row { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
    .gate-panel .btn-primary, .gate-panel .btn-secondary { min-height: 2.75rem; border-radius: 999px; font-weight: 600; border: 0; cursor: pointer; text-align: center; line-height: 2.75rem; text-decoration: none; }
    .gate-panel .btn-primary { background: #0f766e; color: #fff; }
    .gate-panel .btn-secondary { background: #f5f5f4; color: #1c1917; }
    .gate-panel .alert { color: #b91c1c; font-size: 0.875rem; }
    .spinner { width: 2rem; height: 2rem; border: 3px solid rgba(255,255,255,0.25); border-top-color: #5eead4; border-radius: 999px; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="gate" class="gate" role="status">
    <div class="gate-loading">
      <div class="spinner" aria-hidden="true"></div>
      <p>Opening editor…</p>
    </div>
  </div>
  <script src="edit-gateway.js"></script>
</body>
</html>
