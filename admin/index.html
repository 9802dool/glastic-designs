<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Glastic shop">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/logo.jpg">
  <title>Your shop | Glastic Designs</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      color-scheme: light;
      --shell: 30rem;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --brand: #0f766e;
      --brand-dark: #115e59;
      --brand-soft: #f0fdfa;
      --ink: #1c1917;
      --ink-muted: #57534e;
      --ink-faint: #78716c;
      --line: #e7e5e4;
      --surface: #ffffff;
      --canvas: #f5f5f4;
      --radius-sm: 0.75rem;
      --radius: 1rem;
      --radius-lg: 1.25rem;
      --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.05);
      --header-h: 3.25rem;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: Inter, system-ui, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--ink);
      background: var(--canvas);
    }
    .shell {
      width: 100%;
      max-width: var(--shell);
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--canvas);
    }
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      flex-shrink: 0;
      background: rgba(245, 245, 244, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding-top: env(safe-area-inset-top);
    }
    .top-bar-inner {
      display: grid;
      grid-template-columns: 2.75rem 1fr 2.75rem;
      align-items: center;
      min-height: var(--header-h);
      padding: 0 var(--space-4);
      gap: var(--space-2);
    }
    .top-bar .back {
      grid-column: 1;
      justify-self: start;
      width: 2.75rem;
      height: 2.75rem;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--brand-dark);
      font-size: 1.125rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .top-bar .back:active { background: var(--brand-soft); }
    .top-bar .back[hidden] { visibility: hidden; pointer-events: none; }
    .top-bar .sign-out {
      grid-column: 3;
      justify-self: end;
      border: 0;
      background: transparent;
      color: var(--ink-faint);
      font-size: 0.8125rem;
      font-weight: 500;
      padding: var(--space-2);
      min-height: 2.75rem;
      cursor: pointer;
    }
    .top-bar .sign-out[hidden] { display: none; }
    .top-bar-titles {
      grid-column: 2;
      text-align: center;
      min-width: 0;
      padding: var(--space-1) 0;
    }
    .top-bar-titles .eyebrow {
      margin: 0;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--brand);
    }
    .top-bar-titles h1 {
      margin: 0;
      font-size: 1.0625rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page {
      flex: 1;
      padding: var(--space-5) var(--space-4) var(--space-4);
      min-height: 0;
    }
    body.has-footer .page {
      padding-bottom: calc(5.5rem + env(safe-area-inset-bottom));
    }
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      padding: var(--space-3) var(--space-4) max(var(--space-3), env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      box-shadow: 0 -4px 16px rgba(28, 25, 23, 0.04);
    }
    .bottom-bar-inner {
      width: 100%;
      max-width: var(--shell);
      margin: 0 auto;
    }
    .bottom-bar[hidden] { display: none !important; }
    body:not(.has-footer) .bottom-bar { display: none !important; }

    h2.page-title {
      margin: 0 0 var(--space-2);
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--ink);
    }
    p.lead {
      margin: 0 0 var(--space-5);
      font-size: 0.9375rem;
      color: var(--ink-muted);
      line-height: 1.45;
    }
    .muted { color: var(--ink-muted); font-size: 0.9375rem; }
    .section-label {
      margin: 0 0 var(--space-3);
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--ink-faint);
      letter-spacing: 0.02em;
    }

    button, .btn {
      font: inherit;
      font-weight: 600;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 3.25rem;
      padding: 0 var(--space-4);
      border: 0;
      border-radius: var(--radius);
      background: var(--brand);
      color: #fff;
      font-size: 1rem;
    }
    .btn-primary:active:not(:disabled) { background: var(--brand-dark); }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 3rem;
      padding: 0 var(--space-4);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--brand-dark);
      font-size: 0.9375rem;
    }
    .btn-secondary:active { background: #fafaf9; }
    .btn-ghost-link {
      display: block;
      width: 100%;
      margin-top: var(--space-4);
      padding: var(--space-3);
      border: 0;
      background: transparent;
      color: var(--ink-faint);
      font-size: 0.8125rem;
      font-weight: 500;
      text-align: center;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .file-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      cursor: pointer;
    }
    .file-btn input { display: none; }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .menu-btn {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      width: 100%;
      min-height: 4.25rem;
      padding: var(--space-4);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      text-align: left;
      color: var(--ink);
    }
    .menu-btn:active { background: var(--brand-soft); border-color: #99f6e4; }
    .menu-btn .icon {
      width: 2.75rem;
      height: 2.75rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 1.125rem;
    }
    .menu-btn .label {
      display: block;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .menu-btn .sub {
      display: block;
      margin-top: 0.125rem;
      font-size: 0.8125rem;
      font-weight: 400;
      color: var(--ink-muted);
      line-height: 1.35;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      box-shadow: var(--shadow-sm);
    }
    .card + .card { margin-top: var(--space-3); }
    .product-chip {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3);
      border-radius: var(--radius);
      background: var(--brand-soft);
      margin-bottom: var(--space-4);
    }
    .product-chip img, .product-chip .ph {
      width: 3rem;
      height: 3rem;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: var(--line);
      flex-shrink: 0;
    }
    .product-chip strong { font-size: 0.9375rem; display: block; }

    .pick-list { display: flex; flex-direction: column; gap: var(--space-2); }
    .pick {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      width: 100%;
      min-height: 4.5rem;
      padding: var(--space-3);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      text-align: left;
      box-shadow: var(--shadow-sm);
    }
    .pick:active { border-color: #99f6e4; background: var(--brand-soft); }
    .pick img, .pick .ph {
      width: 3.25rem;
      height: 3.25rem;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: var(--line);
      flex-shrink: 0;
    }
    .pick .meta { min-width: 0; flex: 1; }
    .pick strong { display: block; font-size: 0.9375rem; font-weight: 600; }
    .pick span.price { display: block; font-size: 0.8125rem; color: var(--ink-muted); margin-top: 0.125rem; }
    .pick .chev { color: #a8a29e; font-size: 0.75rem; flex-shrink: 0; }

    label.field {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 var(--space-2);
    }
    .field-block + .field-block { margin-top: var(--space-5); }
    input, textarea {
      width: 100%;
      font: inherit;
      font-size: 16px;
      line-height: 1.45;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.875rem var(--space-4);
      background: var(--surface);
      color: var(--ink);
    }
    input:focus, textarea:focus {
      outline: 2px solid #99f6e4;
      outline-offset: 0;
      border-color: var(--brand);
    }
    textarea { min-height: 6.5rem; resize: vertical; }

    .alert {
      border-radius: var(--radius);
      padding: var(--space-3) var(--space-4);
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.45;
      margin: var(--space-4) 0 0;
    }
    .alert[hidden] { display: none !important; }
    .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #14532d; border: 1px solid #bbf7d0; }

    .steps {
      display: flex;
      gap: var(--space-2);
      margin: 0 0 var(--space-5);
    }
    .steps span {
      flex: 1;
      height: 4px;
      border-radius: 999px;
      background: var(--line);
    }
    .steps span.on { background: var(--brand); }

    .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .chips button {
      min-height: 2.75rem;
      padding: 0 var(--space-4);
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--ink);
    }
    .chips button.on {
      background: var(--brand-soft);
      border-color: #5eead4;
      color: var(--brand-dark);
      font-weight: 600;
    }

    .theme-list { display: flex; flex-direction: column; gap: var(--space-2); }
    .theme-card {
      width: 100%;
      min-height: 4.5rem;
      padding: var(--space-4);
      border: 2px solid transparent;
      border-radius: var(--radius-lg);
      text-align: left;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
      box-shadow: var(--shadow-sm);
    }
    .theme-card:active { transform: scale(0.99); }

    .photo-preview {
      width: 100%;
      aspect-ratio: 4 / 3;
      max-height: 14rem;
      object-fit: cover;
      border-radius: var(--radius-lg);
      background: var(--line);
      display: block;
      margin: 0 0 var(--space-4);
    }
    .photo-empty {
      width: 100%;
      aspect-ratio: 4 / 3;
      max-height: 12rem;
      border-radius: var(--radius-lg);
      background: var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-faint);
      font-size: 0.875rem;
      margin: 0 0 var(--space-4);
    }

    .done-screen {
      text-align: center;
      padding: var(--space-8) var(--space-2) var(--space-4);
    }
    .done-icon {
      width: 4rem;
      height: 4rem;
      margin: 0 auto var(--space-5);
      border-radius: 999px;
      background: #ecfdf5;
      color: #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .done-screen h2 {
      margin: 0 0 var(--space-2);
      font-size: 1.375rem;
      font-weight: 700;
    }
    .stack { display: flex; flex-direction: column; gap: var(--space-2); }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      padding: var(--space-8) 0;
      color: var(--ink-muted);
      font-size: 0.9375rem;
    }
    .spinner {
      width: 2rem;
      height: 2rem;
      border: 3px solid var(--line);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: var(--space-6) var(--space-4);
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: var(--radius-lg);
    }
    .empty-state p { margin: 0 0 var(--space-4); color: var(--ink-muted); }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
    }
    .auth-card p { margin: 0 0 var(--space-4); color: var(--ink-muted); font-size: 0.9375rem; }

    @media (min-width: 768px) {
      .page { padding-top: var(--space-6); }
      h2.page-title { font-size: 1.5rem; }
    }
    @media (min-width: 1280px) {
      body { background: #ebeae8; }
      .shell { box-shadow: 0 0 0 1px var(--line); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top-bar">
      <div class="top-bar-inner">
        <button type="button" class="back" id="nav-back" hidden aria-label="Go back"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
        <div class="top-bar-titles">
          <p class="eyebrow">Glastic Designs</p>
          <h1 id="title">Your shop</h1>
        </div>
        <button type="button" class="sign-out" id="sign-out" hidden>Sign out</button>
      </div>
    </header>
    <main class="page" id="app" aria-live="polite"></main>
    <footer class="bottom-bar" id="footer-bar" hidden>
      <div class="bottom-bar-inner" id="footer-inner"></div>
    </footer>
  </div>
  <script src="/admin/simple.js"></script>
</body>
</html>
