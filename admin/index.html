<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Glastic shop">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/logo.jpg">
  <title>Your shop | Glastic Designs</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { color-scheme: light; --tap: #0f766e; --tap-dark: #115e59; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #fafaf9; color: #1c1917; font-size: 17px; line-height: 1.45; }
    header, main { width: min(100%, 28rem); margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
    header { padding-top: max(1rem, env(safe-area-inset-top)); padding-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
    main { padding-bottom: max(2rem, env(safe-area-inset-bottom)); }
    h1 { font-size: 1.65rem; font-weight: 700; margin: 0.15rem 0 0; color: #064e3b; line-height: 1.2; }
    h2 { font-size: 1.25rem; font-weight: 700; margin: 0 0 0.75rem; }
    .eyebrow { margin: 0; color: var(--tap); font-weight: 600; font-size: 0.8rem; }
    .muted { color: #57534e; font-size: 0.95rem; }
    button, .btn, .file-btn { font: inherit; font-weight: 600; border: 0; border-radius: 1rem; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:disabled { opacity: 0.45; }
    .primary { background: var(--tap); color: #fff; width: 100%; min-height: 52px; font-size: 1.05rem; padding: 0.75rem 1rem; }
    .primary:active { background: var(--tap-dark); }
    .ghost { background: #fff; color: var(--tap-dark); border: 1px solid #d6d3d1; width: 100%; min-height: 48px; padding: 0.65rem 1rem; }
    .quiet { background: transparent; color: #57534e; min-height: 44px; padding: 0.35rem 0.5rem; font-weight: 500; font-size: 0.9rem; }
    .menu-btn { display: flex; align-items: center; gap: 1rem; width: 100%; min-height: 72px; padding: 1rem 1.1rem; margin: 0.55rem 0; background: #fff; border: 1px solid #e7e5e4; border-radius: 1.25rem; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,.04); font-size: 1.08rem; font-weight: 600; color: #1c1917; }
    .menu-btn:active { background: #f0fdfa; border-color: #99f6e4; }
    .menu-btn i { width: 2.25rem; height: 2.25rem; display: flex; align-items: center; justify-content: center; background: #f0fdfa; color: var(--tap); border-radius: 0.75rem; font-size: 1.15rem; flex-shrink: 0; }
    input, textarea { width: 100%; font: inherit; font-size: 16px; border: 1px solid #d6d3d1; border-radius: 1rem; padding: 0.95rem 1rem; background: #fff; }
    textarea { min-height: 6.5rem; resize: vertical; }
    label.field { display: block; font-weight: 600; font-size: 0.95rem; margin: 1rem 0 0.4rem; }
    .card { background: #fff; border-radius: 1.25rem; padding: 1rem; margin: 0.75rem 0; border: 1px solid #e7e5e4; }
    .banner { border-radius: 1rem; padding: 0.85rem 1rem; margin: 0.75rem 0; font-weight: 500; }
    .banner.bad { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .banner.ok { background: #f0fdf4; color: #14532d; border: 1px solid #bbf7d0; }
    .pick { display: flex; align-items: center; gap: 0.85rem; width: 100%; min-height: 76px; padding: 0.75rem; margin: 0.5rem 0; background: #fff; border: 1px solid #e7e5e4; border-radius: 1.15rem; text-align: left; }
    .pick img { width: 3.5rem; height: 3.5rem; object-fit: cover; border-radius: 0.85rem; background: #e7e5e4; flex-shrink: 0; }
    .pick .ph { width: 3.5rem; height: 3.5rem; border-radius: 0.85rem; background: #e7e5e4; flex-shrink: 0; }
    .pick strong { display: block; font-size: 1rem; }
    .pick span { font-size: 0.9rem; color: #57534e; }
    .done-box { text-align: center; padding: 2rem 0.5rem; }
    .done-box i.fa-circle-check { font-size: 3rem; color: #059669; margin-bottom: 1rem; }
    .steps { display: flex; gap: 0.35rem; margin: 0.75rem 0 1rem; }
    .steps span { flex: 1; height: 4px; border-radius: 999px; background: #e7e5e4; }
    .steps span.on { background: var(--tap); }
    .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.5rem; }
    .chips button { min-height: 44px; padding: 0.4rem 0.85rem; border-radius: 999px; border: 1px solid #d6d3d1; background: #fff; font-size: 0.95rem; }
    .chips button.on { background: #f0fdfa; border-color: #99f6e4; color: #115e59; }
    .theme-card { width: 100%; min-height: 88px; border-radius: 1.15rem; border: 2px solid #e7e5e4; padding: 1rem; margin: 0.55rem 0; text-align: left; font-weight: 700; font-size: 1.05rem; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
    .theme-card:active { transform: scale(0.99); }
    .photo-preview { width: 100%; max-height: 14rem; object-fit: cover; border-radius: 1rem; background: #e7e5e4; display: block; margin: 0.75rem 0; }
    .more-link { display: block; text-align: center; margin-top: 1.5rem; font-size: 0.88rem; }
    .more-link a { color: #78716c; }
    .split-actions { display: grid; gap: 0.5rem; margin-top: 1.25rem; }
    .big-toggle { width: 100%; min-height: 56px; font-size: 1.05rem; border-radius: 1rem; }
    .big-toggle.hide { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
    .big-toggle.show { background: #f0fdf4; color: #047857; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Glastic Designs</p>
      <h1 id="title">Your shop</h1>
    </div>
    <button type="button" class="quiet" id="sign-out" hidden>Sign out</button>
  </header>
  <main id="app"></main>
  <script src="/admin/simple.js"></script>
</body>
</html>
